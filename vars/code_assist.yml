---
_gemini_defaults:
  # Authentication type for ~/.gemini/settings.json
  # Valid: oauth-personal, gemini-api-key, vertex-ai, compute-default-credentials
  auth_type: oauth-personal

  # Optional sandbox runtime for shell/code execution
  # Valid values: "podman", "docker", or "" (no sandbox, default)
  tools_sandbox: ""

  # Environment variables deployed as ~/.gemini/.env
  # Empty dict = no .env file created on the VM
  env: {}

  # Extensions installed via `gemini extensions install`
  extensions:
    - name: code-review
      source: https://github.com/gemini-cli-extensions/code-review
    - name: conductor
      source: https://github.com/gemini-cli-extensions/conductor
      ref: conductor-v0.4.1
    - name: gemini-cli-security
      source: https://github.com/gemini-cli-extensions/security
      ref: v0.5.0

_claude_defaults:
  # Environment variables deployed to the "env" section of ~/.claude/settings.json
  # Empty dict = no "env" block rendered
  env: {}
